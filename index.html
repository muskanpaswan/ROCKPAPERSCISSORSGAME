<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Rock Paper Scissors Game</h1>
    </header>

    <main>
        <div>
            <h2 class="wonn">WON..!</h2>
        </div>

        <div class="container">
            <div>
                <h2>User</h2>
                <img class="user" src="./images/dummyImages.jpeg" alt="User Choice" />
            </div>
            <div>
                <h2>Computer</h2>
                <img class="computer" src="./images/dummyImages.jpeg" alt="Computer Choice" />
            </div>
        </div>

        <div class="Choose">
            <h3>Choose Your Weapon!</h3>
        </div>

        <div class="button">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissor">Scissor</button>
        </div>

        <p id="result"></p>
    </main>

    <script src="./main.js"></script>
</body>

</html>
